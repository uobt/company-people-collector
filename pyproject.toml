[project]
name = "company-people-collector"
version = "0.1.0"
description = "Поиск LinkedIn-страниц компаний по их сайтам и импорт разрешённых данных о сотрудниках"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
company-people = "company_people.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
